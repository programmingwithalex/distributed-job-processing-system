# let Argo CD compare the local application overlay with the running k3d cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dist-jobs-local
  namespace: argocd
spec:
  # use the default project, which permits the local cluster and public repository
  project: default
  source:
    repoURL: https://github.com/programmingwithalex/distributed-job-processing-system.git
    # follow merged desired state instead of this feature branch
    targetRevision: main
    path: infra/k8s/overlays/local
  destination:
    # address the cluster where Argo CD itself is running
    server: https://kubernetes.default.svc
    namespace: dist-jobs

# automated sync is intentionally omitted so the first reconciliation requires manual approval