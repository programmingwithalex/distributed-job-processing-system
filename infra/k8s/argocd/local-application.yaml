# let Argo CD compare the local Helm release with the running k3d cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dist-jobs-local
  namespace: argocd
spec:
  # use the default project, which permits the local cluster and public repository
  project: default
  source:
    repoURL: https://github.com/programmingwithalex/distributed-job-processing-system.git
    # follow merged desired state instead of this feature branch
    targetRevision: main
    path: infra/k8s/charts/distributed-jobs
    helm:
      releaseName: dist-jobs
      valueFiles:
        - values-local.yaml
  destination:
    # address the cluster where Argo CD itself is running
    server: https://kubernetes.default.svc
    namespace: dist-jobs
  # KEDA's HPA owns worker replicas; Argo previously reset them to the chart value and blocked scale-to-zero
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: celery-worker
      namespace: dist-jobs
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    # apply the ignore rule during sync so Argo does not restore the chart replica count
    syncOptions:
      - RespectIgnoreDifferences=true
    automated:
      # apply desired state and correct live drift without requiring manual sync
      enabled: true
      selfHeal: true
      # keep resources removed from git until deletion is enabled separately
      prune: false
