# compare the Git-tracked EKS release with the running cluster for manual synchronization
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dist-jobs-eks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/programmingwithalex/distributed-job-processing-system.git
    targetRevision: main
    # Argo CD finds this directory's kustomization.yaml and follows its resource references
    path: infra/k8s/overlays/eks
  destination:
    server: https://kubernetes.default.svc
    namespace: dist-jobs
# automated sync is omitted so EKS changes require explicit review and manual approval
