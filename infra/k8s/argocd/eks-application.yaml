# compare the Git-tracked EKS release with the running cluster for manual synchronization
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dist-jobs-eks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/programmingwithalex/distributed-job-processing-system.git
    targetRevision: main
    # Argo CD renders this chart with the Git-tracked EKS release values
    path: infra/k8s/charts/distributed-jobs
    helm:
      releaseName: dist-jobs
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dist-jobs
# automated sync is omitted so EKS changes require explicit review and manual approval
