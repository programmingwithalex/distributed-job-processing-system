# always loaded by default, values-local.yaml and values-eks.yaml enhance/override these default values
# `helm upgrade --install <release-name> <chart-path> -f values-eks.yaml`
releaseTag: latest

applicationSecret:
  create: false
  stringData: {}

config:
  appEnv: local
  logLevel: INFO
  apiHost: 0.0.0.0
  apiPort: "8000"
  defaultMaximumAttemptCount: "3"
  apiProxyTarget: http://api:8000

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

rabbitmq:
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 3.13-management
    pullPolicy: IfNotPresent

api:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  image:
    repository: distributed-job-processing-system-api
    pullPolicy: IfNotPresent

celeryWorker:
  replicaCount: 1
  image:
    repository: distributed-job-processing-system-celery_worker
    pullPolicy: IfNotPresent

keda:
  celeryWorker:
    enabled: true
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 0
    maxReplicaCount: 5
    queueName: celery
    queueLength: "5"

frontend:
  replicaCount: 1
  image:
    repository: distributed-job-processing-system-frontend
    pullPolicy: IfNotPresent
