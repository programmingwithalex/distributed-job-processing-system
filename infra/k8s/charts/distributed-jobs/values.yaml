# this file supplies the shared defaults helm loads before environment-specific overrides
# it configures application images, process resources, broker settings, and persistent storage requests
# local and eks values override these defaults rather than maintaining separate deployment templates
# empty storage class names use the cluster default, while eks overrides can request dedicated ebs classes
# helm upgrade --install <release-name> <chart-path> -f values-eks.yaml
releaseTag: latest

applicationSecret:
  create: false
  stringData: {}

config:
  appEnv: local
  logLevel: INFO
  apiHost: 0.0.0.0
  apiPort: "8000"
  defaultMaximumAttemptCount: "3"
  apiProxyTarget: http://api:8000

postgres:
  replicaCount: 1
  persistence:
    createStorageClass: false
    storageClassName: ""
    size: 10Gi
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

rabbitmq:
  replicaCount: 1
  persistence:
    createStorageClass: false
    storageClassName: ""
    size: 5Gi
  image:
    repository: rabbitmq
    tag: 3.13-management
    pullPolicy: IfNotPresent

kafka:
  enabled: false
  clusterDomain: cluster.local
  clusterId: 5L6g3nShT-eMCtK--X86sw
  logRetentionMilliseconds: "604800000"
  image:
    repository: apache/kafka
    tag: 4.1.1
    pullPolicy: IfNotPresent
  persistence:
    createStorageClass: false
    storageClassName: ""
    size: 10Gi
    mountPath: /var/lib/kafka/data
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

api:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  image:
    repository: distributed-job-processing-system-api
    pullPolicy: IfNotPresent

celeryWorker:
  replicaCount: 1
  image:
    repository: distributed-job-processing-system-celery_worker
    pullPolicy: IfNotPresent

backgroundWorkers:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

keda:
  celeryWorker:
    enabled: true
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 0
    maxReplicaCount: 5
    queueName: celery
    queueLength: "5"

frontend:
  replicaCount: 1
  image:
    repository: distributed-job-processing-system-frontend
    pullPolicy: IfNotPresent
