# this file overrides shared chart defaults for the local kubernetes development environment
# it enables kafka and supplies development-only connection settings through the application secret
# persistent claims use the local cluster's default storage provisioner rather than eks ebs classes
# these credentials and mutable development image tags are not production deployment inputs
releaseTag: latest

kafka:
  enabled: true

applicationSecret:
  create: true
  stringData:
    POSTGRES_DB: jobs
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq.dist-jobs.svc.cluster.local:5672//
