apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    # expose PostgreSQL before the migration Job starts at wave -1
    argocd.argoproj.io/sync-wave: "-2"
    distributed-jobs.dev/source-revision: {{ .Values.releaseTag | quote }}
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
