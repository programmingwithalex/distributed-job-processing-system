{{- if and .Values.kafka.enabled .Values.kafka.persistence.createStorageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.kafka.persistence.storageClassName }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: distributed-jobs
    distributed-jobs.dev/environment: development
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    distributed-jobs.dev/lifecycle: development-only
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
{{- end }}