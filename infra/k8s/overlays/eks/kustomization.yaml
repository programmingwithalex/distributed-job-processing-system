# EKS overlay that reuses the shared base and overrides only environment-specific values
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dist-jobs
resources:
  - ../../base
  - monitoring/api-service-monitor.yaml
  - monitoring/api-prometheus-rule.yaml
  - monitoring/api-grafana-dashboard.yaml

# do not add secret.example.yaml here as a live resource
# create an uncommitted secret.yaml from secret.example.yaml or create the
# application-secrets Secret externally before deploying this overlay to EKS
images:
  - name: distributed-job-processing-system-api:latest
    newName: 257492816994.dkr.ecr.us-east-1.amazonaws.com/distributed-job-processing-system-api
    newTag: v1
  - name: distributed-job-processing-system-celery_worker:latest
    newName: 257492816994.dkr.ecr.us-east-1.amazonaws.com/distributed-job-processing-system-celery-worker
    newTag: v1
  - name: distributed-job-processing-system-frontend:latest
    newName: 257492816994.dkr.ecr.us-east-1.amazonaws.com/distributed-job-processing-system-frontend
    newTag: v1
patches:
  - path: configmap-patch.yaml
