# example secret shape for EKS deployments only
# do not commit a real secret.yaml file to version control
# before deploying this overlay, either:
# 1. create an uncommitted secret.yaml from this file and apply it manually, or
# 2. create a Kubernetes Secret named application-secrets by another process
apiVersion: v1
kind: Secret
metadata:
  name: application-secrets
type: Opaque
stringData:
  POSTGRES_DB: jobs
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql+psycopg://postgres:replace-me@postgres:5432/jobs
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//