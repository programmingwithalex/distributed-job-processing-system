# concrete local secret values used by the first k3d deployment
# this file is fine for local learning but should not be reused as-is for real environments
apiVersion: v1
kind: Secret
metadata:
  name: application-secrets
type: Opaque
stringData:
  POSTGRES_DB: jobs
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//