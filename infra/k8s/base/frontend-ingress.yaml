# route browser requests for / to the frontend service through ingress-nginx
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # send all non-api browser traffic to the frontend service
                name: frontend
                port:
                  number: 5173