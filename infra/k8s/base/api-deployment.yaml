# fastapi deployment that serves requests and runs migrations on startup
apiVersion: apps/v1
kind: Deployment
metadata:
  # deployment object name inside kubernetes
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      # deployment manages pods carrying this app label
      app: api
  template:
    metadata:
      labels:
        # pod label that must match the selector above
        app: api
    spec:
      containers:
        - name: api
          # container name inside the pod, separate from the deployment name above
          image: distributed-job-processing-system-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # shared non-secret settings
          envFrom:
            - configMapRef:
                name: application-config
          # connection strings stay in the secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: CELERY_BROKER_URL
          # the health route is enough for a first-pass readiness signal
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          # restart the container if the api stops serving health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20