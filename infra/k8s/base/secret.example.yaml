# example secret values for local development only
# copy the shape into an overlay and replace values for real environments
apiVersion: v1
kind: Secret
metadata:
  name: application-secrets
type: Opaque
stringData:
  POSTGRES_DB: jobs
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//