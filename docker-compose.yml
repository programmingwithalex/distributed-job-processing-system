services:
  frontend:
    # run the react dashboard in a containerized vite dev server for local development
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    environment:
      # route frontend api calls to the fastapi service over the compose network
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        # wait until the api container has started before launching the frontend
        condition: service_started
    ports:
      - "5173:5173"

  api:
    # serve the fastapi application and run migrations on startup
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      DEFAULT_MAXIMUM_ATTEMPT_COUNT: 3
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres:
        # block api startup until postgres accepts connections
        condition: service_healthy
      rabbitmq:
        # block api startup until the broker is reachable
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    # process queued jobs using the same shared application code as the api
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      DEFAULT_MAXIMUM_ATTEMPT_COUNT: 3
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres:
        # worker needs the database before it can persist job state changes
        condition: service_healthy
      rabbitmq:
        # worker needs the broker before it can consume tasks
        condition: service_healthy

  rabbitmq:
    # broker for celery task delivery
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    # system of record for job state and metadata
    image: postgres:16
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:  # preserve across container restarts
  postgres_data:
