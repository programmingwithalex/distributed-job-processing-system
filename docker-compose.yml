services:
  frontend:
    # run the react dashboard in a containerized vite dev server for local development
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    environment:
      # route frontend api calls to the fastapi service over the compose network
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        # wait until the api health endpoint responds before launching the frontend
        condition: service_healthy
    ports:
      - "5173:5173"

  api:
    # serve the fastapi application after the one-off migration service succeeds
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      DEFAULT_MAXIMUM_ATTEMPT_COUNT: 3
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      database_migration:
        # never start application replicas against an older database schema
        condition: service_completed_successfully
      postgres:
        # block api startup until postgres accepts connections
        condition: service_healthy
      rabbitmq:
        # block api startup until the broker is reachable
        condition: service_healthy
    healthcheck:
      # use Python from the api image instead of adding curl to the runtime image
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "8000:8000"

  database_migration:
    # apply pending schema changes once before api and worker containers start
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]  # overrides Dockerfile.api's default command to run migrations only
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
    depends_on:
      postgres:
        condition: service_healthy

  celery_worker:
    # process queued jobs using the same shared application code as the api
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      DEFAULT_MAXIMUM_ATTEMPT_COUNT: 3
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      database_migration:
        # worker persistence requires the same current schema as the api
        condition: service_completed_successfully
      postgres:
        # worker needs the database before it can persist job state changes
        condition: service_healthy
      rabbitmq:
        # worker needs the broker before it can consume tasks
        condition: service_healthy

  outbox_publisher:
    # publish committed lifecycle events independently from Celery job execution
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    command: ["publish-job-events"]
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_EVENTS_TOPIC: job-events.v1
    depends_on:
      database_migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  history_consumer:
    # project Kafka lifecycle events into queryable PostgreSQL job history
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    command: ["consume-job-events"]
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/jobs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_EVENTS_TOPIC: job-events.v1
      JOB_HISTORY_CONSUMER_GROUP: job-history-v1
    depends_on:
      database_migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  rabbitmq:
    # broker for celery task delivery
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    # single-node KRaft broker for local job lifecycle events
    image: apache/kafka:4.1.1
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: "-1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    # system of record for job state and metadata
    image: postgres:16
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:  # preserve across container restarts
  postgres_data:
  kafka_data:
