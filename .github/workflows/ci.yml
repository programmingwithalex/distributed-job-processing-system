name: Continuous Integration

# validate every pull request without requiring AWS credentials
on:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check infrastructure formatting
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          npx --yes prettier@3.5.3 --check \
            README.md \
            infra/k8s/README.md \
            infra/k8s/overlays/README.md \
            infra/k8s/overlays/eks/README.md \
            infra/k8s/monitoring/*.yaml \
            infra/k8s/overlays/local/kustomization.yaml \
            infra/k8s/overlays/local/local-monitoring-values.yaml \
            infra/k8s/overlays/eks/kustomization.yaml

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize infra/k8s/overlays/local > /dev/null
          kubectl kustomize infra/k8s/overlays/eks > /dev/null

      # -n checks for syntax errors without executing the scripts
      - name: Validate deployment scripts
        run: |
          bash -n infra/k8s/overlays/local/deploy-local-stack.sh
          bash -n infra/k8s/overlays/eks/deploy-eks-application-stack.sh
          bash -n infra/k8s/overlays/eks/destroy-eks-application-stack.sh
          bash -n infra/k8s/overlays/eks/publish-images.sh

      # validates both monitoring configurations can produce valid Kubernetes manifests from exact Helm chart deployed
      # catches mistakes such as invalid YAML, invalid Helm value names or types, malformed templating inputs, and chart-version incompatibilities
      # downloads pinned `kube-prometheus-stack` chart version 87.21.0 from GitHub Container Registry
      # (1) local | (2) EKS
      - name: Render monitoring chart values
        run: |
          helm template monitoring oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --namespace monitoring \
            --version 87.21.0 \
            --values infra/k8s/overlays/local/local-monitoring-values.yaml > /dev/null
          helm template monitoring oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --namespace monitoring \
            --version 87.21.0 \
            --values infra/k8s/overlays/eks/monitoring/eks-monitoring-values.yaml > /dev/null

  # validate the FastAPI and worker code independently of browser tests
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Lint backend code
        run: uv run ruff check .

      - name: Test backend code
        run: uv run pytest

  # run the dashboard against the local Compose dependency stack
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # compare the pull request's base and head commits without another API dependency
          fetch-depth: 0

      - name: Detect frontend integration changes
        id: frontend_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .dockerignore \
            .github/workflows/ci.yml \
            alembic \
            alembic.ini \
            app \
            docker-compose.yml \
            frontend \
            infra/docker \
            pyproject.toml \
            uv.lock; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No frontend integration changes detected"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Frontend integration changes detected"
          fi

      # setup-node requires pnpm to exist before it can resolve the pnpm cache location
      - uses: pnpm/action-setup@v4
        if: steps.frontend_changes.outputs.required == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.frontend_changes.outputs.required == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.frontend_changes.outputs.required == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.frontend_changes.outputs.required == 'true'
        working-directory: frontend
        run: pnpm build

      - name: Start local application stack
        if: steps.frontend_changes.outputs.required == 'true'
        run: docker compose up --build --detach

      - name: Wait for local API
        if: steps.frontend_changes.outputs.required == 'true'
        run: |
          # browser tests require the API before they can create and query jobs
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run frontend end-to-end tests
        if: steps.frontend_changes.outputs.required == 'true'
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload Playwright artifacts
        # retain browser diagnostics only when an end-to-end test fails
        if: failure() && steps.frontend_changes.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Stop local application stack
        # release runner resources even if a prior step fails
        if: always() && steps.frontend_changes.outputs.required == 'true'
        run: docker compose down --volumes
