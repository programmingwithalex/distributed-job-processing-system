name: Promote EKS Release

# release flow:
# 1. resolve the selected Git ref to one immutable commit SHA
# 2. authenticate to GitHub and AWS through short-lived credentials
# 3. publish the API, Celery worker, and frontend images with the same SHA tag
# 4. branch from main and update the Git-tracked EKS Helm release
# 5. lint and render the chart to verify that the SHA reaches every workload
# 6. open a promotion pull request only when the desired release changed
# 7. deploy separately by manually syncing Argo CD after review and merge
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose application images should be promoted
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-release-promotion
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        # check out the application revision whose images will be published
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release revision
        # expose the full SHA and deterministic promotion metadata to later steps
        id: release
        run: |
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved release revision is not a full Git SHA: $release_sha" >&2
            exit 1
          fi

          {
            echo "sha=$release_sha"
            echo "short_sha=${release_sha:0:12}"
            echo "branch=release/promote-${release_sha:0:12}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promotion credentials
        # fail before publishing when either required credential is unavailable
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          test -n "$AWS_GITHUB_ACTIONS_ROLE_ARN"
          test -n "$GH_TOKEN"
          gh auth status

      - name: Configure AWS credentials
        # exchange GitHub's OIDC token for temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish immutable release images
        # build and push all application images as one immutable release bundle
        env:
          IMAGE_TAG: ${{ steps.release.outputs.sha }}
        run: bash infra/k8s/overlays/eks/publish-images.sh

      - name: Create promotion branch
        # switch from the selected source revision to main's GitOps desired state
        env:
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git fetch origin main
          git switch --create "$PROMOTION_BRANCH" origin/main

      - name: Read Git-tracked EKS release
        # read the current value semantically instead of parsing YAML as text
        id: current_release
        uses: mikefarah/yq@v4.47.2
        with:
          cmd: >-
            yq -r '.releaseTag'
            infra/k8s/charts/distributed-jobs/values-eks.yaml

      - name: Update Git-tracked EKS release
        # skip the write when already current because yq can normalize YAML whitespace
        if: steps.current_release.outputs.result != steps.release.outputs.sha
        uses: mikefarah/yq@v4.47.2
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          cmd: >-
            yq -i
            '.releaseTag = strenv(RELEASE_SHA)'
            infra/k8s/charts/distributed-jobs/values-eks.yaml

      - name: Set up Helm
        # pin the same Helm version used by CI
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Validate promoted release manifest
        # validate both chart structure and release SHA propagation before committing
        id: manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          chart_dir="infra/k8s/charts/distributed-jobs"
          values_file="$chart_dir/values-eks.yaml"

          helm lint "$chart_dir" --values "$values_file"

          rendered_manifest="$(mktemp)"
          trap 'rm -f "$rendered_manifest"' EXIT
          helm template dist-jobs "$chart_dir" \
            --namespace dist-jobs \
            --values "$values_file" > "$rendered_manifest"

          grep -Fq "distributed-jobs.dev/source-revision: \"$RELEASE_SHA\"" "$rendered_manifest"
          for repository in \
            distributed-job-processing-system-api \
            distributed-job-processing-system-celery-worker \
            distributed-job-processing-system-frontend; do
            grep -Fq "/${repository}:${RELEASE_SHA}" "$rendered_manifest"
          done

          # use the values-file diff as the authority for whether promotion is needed
          if git diff --quiet -- "$values_file"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_SHA is already tracked by the EKS Helm values"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push promotion
        # persist only the desired-state change and publish its release branch
        if: steps.manifest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git config user.name "programmingwithalex"
          git config user.email "programmingwithalex3@gmail.com"
          test "$(git config user.name)" = "programmingwithalex"
          test "$(git config user.email)" = "programmingwithalex3@gmail.com"

          git add -- infra/k8s/charts/distributed-jobs/values-eks.yaml
          git -c user.name="programmingwithalex" \
            -c user.email="programmingwithalex3@gmail.com" \
            commit -m "chore: promote EKS release ${RELEASE_SHA:0:12}"

          gh auth setup-git
          git push --set-upstream origin "$PROMOTION_BRANCH"

      - name: Open promotion pull request
        # request review instead of mutating the cluster directly
        if: steps.manifest.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          body="$(cat <<EOF
          ## Summary

          - promote the EKS release to immutable image tag \`${RELEASE_SHA}\`
          - update the API, Celery worker, and frontend as one atomic release bundle

          ## Deployment

          After review and merge, manually sync the \`dist-jobs-eks\` Application in Argo CD with pruning disabled.
          EOF
          )"

          pr_url="$(gh pr create \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title "Promote EKS release \`${SHORT_SHA}\`" \
            --body "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write promotion summary
        # report either the pull request or the already-promoted no-op result
        if: always() && steps.manifest.outcome == 'success'
        env:
          CHANGED: ${{ steps.manifest.outputs.changed }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "## EKS release promotion"
            echo
            echo "- Image tag: \`$RELEASE_SHA\`"
            if [[ "$CHANGED" == "true" ]]; then
              echo "- Promotion PR: $PR_URL"
              echo "- Next step: review and merge the PR, then manually sync \`dist-jobs-eks\` in Argo CD with pruning disabled."
            else
              echo "- Result: this release is already tracked; no PR was required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
