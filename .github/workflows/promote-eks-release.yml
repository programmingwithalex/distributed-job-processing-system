name: Promote EKS Release

# Publishes the API, Celery worker, and frontend images for a selected Git revision
# under one immutable commit SHA. It then updates the Git-tracked EKS Kustomize
# release on a new branch, validates the rendered manifests, and opens a promotion
# pull request. Deployment remains a separate manual Argo CD sync after review and merge.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose application images should be promoted
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-release-promotion
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release revision
        id: release
        run: |
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved release revision is not a full Git SHA: $release_sha" >&2
            exit 1
          fi

          {
            echo "sha=$release_sha"
            echo "short_sha=${release_sha:0:12}"
            echo "branch=release/promote-${release_sha:0:12}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promotion credentials
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          test -n "$AWS_GITHUB_ACTIONS_ROLE_ARN"
          test -n "$GH_TOKEN"
          gh auth status

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish immutable release images
        env:
          IMAGE_TAG: ${{ steps.release.outputs.sha }}
        run: bash infra/k8s/overlays/eks/publish-images.sh

      - name: Create promotion branch
        id: branch
        env:
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch origin main
          git switch --create "$PROMOTION_BRANCH" origin/main

          release_file="infra/k8s/overlays/eks/kustomization.yaml"
          occurrence_count="$(awk -v sha="$RELEASE_SHA" '{ count += gsub(sha, sha) } END { print count + 0 }' "$release_file")"
          if [[ "$occurrence_count" -eq 4 ]]; then
            echo "already_tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Git-tracked EKS release
        if: steps.branch.outputs.already_tracked != 'true'
        uses: mikefarah/yq@v4.47.2
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          cmd: >-
            yq -i
            '.commonAnnotations."distributed-jobs.dev/source-revision" = strenv(RELEASE_SHA) |
            .images[].newTag = strenv(RELEASE_SHA)'
            infra/k8s/overlays/eks/kustomization.yaml

      - uses: azure/setup-kubectl@v4

      - name: Validate promoted release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          release_file="infra/k8s/overlays/eks/kustomization.yaml"
          occurrence_count="$(awk -v sha="$RELEASE_SHA" '{ count += gsub(sha, sha) } END { print count + 0 }' "$release_file")"
          test "$occurrence_count" -eq 4

          rendered_manifest="$(mktemp)"
          trap 'rm -f "$rendered_manifest"' EXIT
          kubectl kustomize infra/k8s/overlays/eks > "$rendered_manifest"

          grep -Fq "distributed-jobs.dev/source-revision: $RELEASE_SHA" "$rendered_manifest"
          for repository in \
            distributed-job-processing-system-api \
            distributed-job-processing-system-celery-worker \
            distributed-job-processing-system-frontend; do
            grep -Fq "/${repository}:${RELEASE_SHA}" "$rendered_manifest"
          done

          if git diff --quiet -- "$release_file"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_SHA is already tracked by the EKS overlay"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push promotion
        if: steps.manifest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git config user.name "programmingwithalex"
          git config user.email "programmingwithalex3@gmail.com"
          test "$(git config user.name)" = "programmingwithalex"
          test "$(git config user.email)" = "programmingwithalex3@gmail.com"

          git add -- infra/k8s/overlays/eks/kustomization.yaml
          git -c user.name="programmingwithalex" \
            -c user.email="programmingwithalex3@gmail.com" \
            commit -m "chore: promote EKS release ${RELEASE_SHA:0:12}"

          gh auth setup-git
          git push --set-upstream origin "$PROMOTION_BRANCH"

      - name: Open promotion pull request
        if: steps.manifest.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          PROMOTION_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          body="$(cat <<EOF
          ## Summary

          - promote the EKS release to immutable image tag \`${RELEASE_SHA}\`
          - update the API, Celery worker, and frontend as one atomic release bundle

          ## Deployment

          After review and merge, manually sync the \`dist-jobs-eks\` Application in Argo CD with pruning disabled.
          EOF
          )"

          pr_url="$(gh pr create \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title "Promote EKS release \`${SHORT_SHA}\`" \
            --body "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Write promotion summary
        if: always() && steps.manifest.outcome == 'success'
        env:
          CHANGED: ${{ steps.manifest.outputs.changed }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "## EKS release promotion"
            echo
            echo "- Image tag: \`$RELEASE_SHA\`"
            if [[ "$CHANGED" == "true" ]]; then
              echo "- Promotion PR: $PR_URL"
              echo "- Next step: review and merge the PR, then manually sync \`dist-jobs-eks\` in Argo CD with pruning disabled."
            else
              echo "- Result: this release is already tracked; no PR was required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
